[versions]
kotlin = "2.3.21"
springBoot = "4.0.6"
springDependencyManagement = "1.1.7"
springCloud = "2025.0.0"
springdoc = "3.0.3"
# pinned: kafka client version is set indirectly via Spring Boot's BOM; bump only if a service needs a different version.
kafka = "3.5.1"
detekt = "1.23.7"
ktlint = "12.1.1"
benManesVersions = "0.51.0"
junit = "6.0.3"

[libraries]
springCloudDependencies = { group = "org.springframework.cloud", name = "spring-cloud-dependencies", version.ref = "springCloud" }
jacksonModuleKotlin = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin" }
kotlinReflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect" }
springBootStarterWeb = { group = "org.springframework.boot", name = "spring-boot-starter-web" }
springBootStarterWebflux = { group = "org.springframework.boot", name = "spring-boot-starter-webflux" }
springBootStarterActuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }
springBootStarterDataJpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa" }
springBootStarterDataRedis = { group = "org.springframework.boot", name = "spring-boot-starter-data-redis" }
springBootStarterDataElasticsearch = { group = "org.springframework.boot", name = "spring-boot-starter-data-elasticsearch" }
springBootStarterOauth2ResourceServer = { group = "org.springframework.boot", name = "spring-boot-starter-oauth2-resource-server" }
springBootStarterTest = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
springCloudStarterGateway = { group = "org.springframework.cloud", name = "spring-cloud-starter-gateway" }
springKafka = { group = "org.springframework.kafka", name = "spring-kafka" }
springKafkaTest = { group = "org.springframework.kafka", name = "spring-kafka-test" }
postgresql = { group = "org.postgresql", name = "postgresql" }
flyway = { group = "org.flywaydb", name = "flyway-core" }
springdocOpenApi = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
junitBom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junitJupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSpring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlinJpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
benManesVersions = { id = "com.github.ben-manes.versions", version.ref = "benManesVersions" }
